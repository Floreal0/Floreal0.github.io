<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Floreal0 · Work in Progress</title>

<!-- SEO / 分享预览 -->
<meta name="description" content="Floreal0 的个人主页：数学课程笔记、建模项目与学习资料整理（Records & Drafts）。">
<meta property="og:title" content="Floreal0 · Work in Progress">
<meta property="og:description" content="Records & Drafts —— 数学笔记、建模项目与素材整理。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://floreal0.github.io/">

<!-- 移动端浏览器地址栏颜色跟随主题 -->
<meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)">

<!-- emoji favicon（data URI，无需额外文件） -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%B8%3C/text%3E%3C/svg%3E">

<!-- 主题初始化：必须在渲染前执行，避免深色用户进页面闪白。
     手动切换过的用户跟随 localStorage；没切换过的跟随系统偏好 -->
<script>
(function () {
  var saved = null;
  try { saved = localStorage.getItem('site-theme'); } catch (e) {}
  var preferDark = saved === 'dark' ||
    (!saved && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  if (preferDark) document.documentElement.setAttribute('data-theme', 'dark');
})();
</script>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

:root {
  --bg: linear-gradient(135deg, #f8fafc, #e0f2fe, #f0f7ff, #f8f0ff);
  --card: rgba(255, 255, 255, 0.7);
  --card-border: rgba(255, 255, 255, 0.8);
  --text: #2d3748;
  --sub: #718096;
  --li: rgba(247, 249, 252, 0.8);
  --li-hover: rgba(230, 240, 255, 0.9);
  --foot: #a0aec0; /* 修复：原来少了 #，导致浅色模式页脚变成黑色 */
  --switch-bg: rgba(255, 255, 255, 0.4);
  --switch-border: rgba(255, 255, 255, 0.6);
  --switch-knob-pos: 2px;
  --switch-text-color: #000000;
  --switch-time-color: #333333;
  --knob-bg: rgba(255, 255, 255, 0.95);
  --knob-shadow: 0 2px 8px rgba(0,0,0,0.15);
  --btn-bg: rgba(255, 255, 255, 0.25);
  --btn-hover: rgba(255, 255, 255, 0.4);
  --icon-color: #718096;
  --sub-li-bg: rgba(247, 249, 252, 0.95);
}

html[data-theme="dark"] {
  --bg: linear-gradient(135deg, #1e293b, #0f172a);
  --card: rgba(30, 41, 59, 0.7);
  --card-border: rgba(79, 70, 229, 0.3);
  --text: #f1f5f9;
  --sub: #cbd5e1;
  --li: rgba(51, 65, 85, 0.6);
  --li-hover: rgba(59, 130, 246, 0.2);
  --foot: #94a3b8;
  --switch-bg: rgba(15, 23, 42, 0.6);
  --switch-border: rgba(79, 70, 229, 0.5);
  --switch-knob-pos: 88px;
  --switch-text-color: rgba(255, 255, 255, 0.95);
  --switch-time-color: rgba(255,255,255,0.8);
  --knob-bg: rgba(30, 41, 59, 0.9);
  --knob-shadow: 0 2px 8px rgba(0,0,0,0.3);
  --btn-bg: rgba(255, 255, 255, 0.1);
  --btn-hover: rgba(255, 255, 255, 0.18);
  --icon-color: #cbd5e1;
  --sub-li-bg: rgba(51, 65, 85, 0.95);
}

body {
  /* 补全跨平台字体栈：Mac 用苹方，Linux/Android 用思源黑体 */
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC",
               "Microsoft YaHei", "Noto Sans SC", "Segoe UI", sans-serif;
  background: var(--bg);
  background-size: 400% 400%;
  min-height: 100vh;
  padding: 60px 20px;
  animation: bgFlow 25s ease-in-out infinite alternate;
  /* 移除了原来的 transition: all —— 渐变之间本来无法平滑插值，
     只会在主题切换时产生无意义的属性过渡 */
}

@keyframes bgFlow {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

/* 尊重系统的"减少动态效果"偏好：停掉背景流动动画和所有过渡 */
@media (prefers-reduced-motion: reduce) {
  body { animation: none; }
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

.container {
  max-width: 700px;
  margin: 0 auto;
}

.toggle-switch {
  position: fixed;
  top: 20px;
  right: 20px;
  width: 130px;
  height: 42px;
  border-radius: 50px;
  background: var(--switch-bg);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid var(--switch-border);
  box-shadow: 0 2px 15px rgba(0,0,0,0.08);
  z-index: 999;
  display: flex;
  align-items: center;
  padding: 0 4px;
  cursor: pointer;
  /* 收窄过渡范围，替代原来的 transition: all */
  transition: background 0.6s cubic-bezier(0.4, 0, 0.2, 1),
              border-color 0.6s ease,
              box-shadow 0.6s ease;
  overflow: hidden;
}

.switch-knob {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: var(--knob-bg);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  display: flex;
  align-items: center;
  justify-content: center;
  position: absolute;
  left: var(--switch-knob-pos);
  transition: left 0.6s cubic-bezier(0.4, 0, 0, 1),
              background 0.4s ease,
              box-shadow 0.4s ease;
  box-shadow: var(--knob-shadow);
}

.icon-sun, .icon-moon {
  width: 20px;
  height: 20px;
  position: absolute;
  transition: opacity 0.4s ease, transform 0.4s ease;
}
.icon-sun {
  opacity: 1;
}
.icon-moon {
  opacity: 0;
}

html[data-theme="dark"] .icon-sun {
  opacity: 0;
  transform: rotate(90deg);
}
html[data-theme="dark"] .icon-moon {
  opacity: 1;
  transform: rotate(0deg);
}

.switch-text {
  position: absolute;
  left: 50%;
  top: calc(100% * 3/5);
  transform: translate(-50%, -50%);
  color: var(--switch-text-color);
  font-size: 14px;
  font-weight: 500;
  transition: color 0.4s ease;
}

.switch-time {
  position: absolute;
  top: 3px;
  left: 50%;
  transform: translateX(-50%);
  color: var(--switch-time-color);
  font-size: 10px;
  transition: color 0.4s ease;
}

.card {
  background: var(--card);
  border-radius: 20px;
  padding: 45px;
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--card-border);
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
  animation: cardFadeIn 1s ease-out forwards;
  opacity: 0;
  transition: background 0.4s ease,
              border-color 0.4s ease,
              box-shadow 0.4s ease;
}

@keyframes cardFadeIn {
  to { opacity: 1; transform: translateY(0); }
  from { opacity: 0; transform: translateY(30px); }
}

h1 {
  font-size: 28px;
  color: var(--text);
  margin-bottom: 8px;
  animation: textFadeIn 1.2s ease-out forwards;
  opacity: 0;
}

.subtitle {
  color: var(--sub);
  margin-bottom: 40px;
  animation: textFadeIn 1.3s ease-out forwards;
  opacity: 0;
}

p {
  color: var(--sub);
  line-height: 1.8;
}

.section {
  margin-bottom: 30px;
  animation: sectionSlide 1.4s ease-out forwards;
  opacity: 0;
}

@keyframes textFadeIn {
  to { opacity: 1; transform: translateY(0); }
  from { opacity: 0; transform: translateY(10px); }
}
@keyframes sectionSlide {
  to { opacity: 1; transform: translateX(0); }
  from { opacity: 0; transform: translateX(-20px); }
}

/* h3 -> h2：修复标题层级跳级（h1 直接跳到 h3） */
.section h2 {
  font-size: 22px;
  color: var(--text);
  margin-bottom: 16px;
}

ul {
  list-style: none;
}

li {
  padding: 14px 18px;
  background: var(--li);
  color: var(--sub);
  border-radius: 12px;
  margin-bottom: 10px;
  /* 替代原来的 transition: all */
  transition: background 0.25s ease,
              color 0.25s ease,
              transform 0.25s ease;
  cursor: pointer;
}

li:hover {
  background: var(--li-hover);
  color: var(--text);
  transform: translateX(6px);
}

/* 展开动画：max-height 数值由 JS 按实际内容高度设置（见底部脚本），
   不再写死 300px，内容再长也不会被裁剪 */
li ul {
  padding-left: 20px;
  max-height: 0;
  opacity: 0;
  overflow: hidden;
  margin-top: 0;
  transition: max-height 0.3s ease-out, opacity 0.3s ease-out, margin-top 0.3s ease-out;
}

li ul.show {
  opacity: 1;
  margin-top: 10px;
}

.parent-item, .sub-parent-item {
  position: relative;
  cursor: pointer;
}

li ul li {
  background: var(--sub-li-bg) !important;
  padding: 10px 14px;
  font-size: 14px;
  margin-bottom: 8px;
  cursor: default;
  overflow: hidden;
  border-radius: 8px;
  border: none;
  outline: none;
  position: relative;
}
li ul li::before,
li ul li::after {
  content: none !important;
}
li ul li:hover {
  background: var(--li-hover);
  transform: translateX(4px);
}

li ul li a {
  color: var(--sub);
  text-decoration: none;
  display: block;
  width: 100%;
  height: 100%;
}
li ul li a:hover {
  color: var(--text);
}

/* 三级列表嵌套样式 */
.sub-parent-item ul {
  padding-left: 30px;
  max-height: 0;
  opacity: 0;
  overflow: hidden;
  margin-top: 0;
  transition: max-height 0.3s ease-out, opacity 0.3s ease-out, margin-top 0.3s ease-out;
}
.sub-parent-item ul.show {
  opacity: 1;
  margin-top: 8px;
}
.sub-parent-item ul li {
  padding: 8px 12px;
  font-size: 13px;
  margin-bottom: 6px;
}
.sub-parent-item ul li:hover {
  transform: translateX(3px);
}

/* ===== giscus 留言区 ===== */
.giscus-wrap {
  margin-bottom: 10px;
}

.giscus-hint {
  padding: 14px 18px;
  background: var(--li);
  color: var(--sub);
  border-radius: 12px;
  font-size: 14px;
  line-height: 1.8;
}

.footer {
  text-align: center;
  margin-top: 50px;
  font-size: 14px;
  color: var(--foot);
  animation: textFadeIn 1.6s ease-out forwards;
  opacity: 0;
}

/* ===== 移动端适配 ===== */
@media (max-width: 480px) {
  body { padding: 84px 14px 40px; }        /* 顶部留出固定开关的高度 */
  .card { padding: 26px 18px; border-radius: 16px; }
  h1 { font-size: 23px; }
  .subtitle { margin-bottom: 28px; }
  .section h2 { font-size: 19px; }
  li { padding: 12px 14px; }

  /* 缩小右上角开关，避免挤压标题 */
  .toggle-switch { top: 12px; right: 12px; width: 112px; height: 38px; }
  .switch-knob { width: 32px; height: 32px; }
  :root { --switch-knob-pos: 2px; }
  html[data-theme="dark"] { --switch-knob-pos: 70px; } /* 112 - 8(padding) - 32(knob) - 2 */
  .switch-text { font-size: 13px; }
  .switch-time { font-size: 9px; }
}
</style>
</head>

<body>

<div class="toggle-switch" id="themeToggle">
  <div class="switch-knob" id="switchKnob">
    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="#2d3748" stroke-width="2">
      <circle cx="12" cy="12" r="5"></circle>
      <line x1="12" y1="1" x2="12" y2="3"></line>
      <line x1="12" y1="21" x2="12" y2="23"></line>
      <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
      <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
      <line x1="1" y1="12" x2="3" y2="12"></line> <!-- 修复：y2 原来缺引号 -->
      <line x1="21" y1="12" x2="23" y2="12"></line>
      <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
      <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
    </svg>
    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="#f1f5f9" stroke-width="2">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
    </svg>
  </div>
  <div class="switch-time" id="switchTime"></div>
  <div class="switch-text" id="switchText">Day</div>
</div>

<div class="container">
  <div class="card">
    <h1>Work in Progress</h1>
    <p class="subtitle">Records &amp; Drafts</p>

    <div class="section">
      <h2>Notes</h2>
      <ul>
        <!-- Math Courses 二级嵌套+超链接 -->
        <li class="parent-item">
          Math Courses
          <ul>
            <li><a href="https://github.com/Floreal0/" target="_blank" rel="noopener noreferrer">数分&amp;高代</a></li>
            <li><a href="https://github.com/Floreal0/" target="_blank" rel="noopener noreferrer">实变函数</a></li>
            <li><a href="https://github.com/Floreal0/" target="_blank" rel="noopener noreferrer">常微分方程</a></li>
          </ul>
        </li>

        <li class="parent-item">
          Projects
          <ul>
            <li>Modeling Templates</li>
            <li>Modeling Attempts</li>
            <li class="sub-parent-item">
              Misc
              <ul>
                <li><a href="https://github.com/Floreal0/GetSongs" target="_blank" rel="noopener noreferrer">歌曲下载</a></li>
                <li><a href="https://github.com/Floreal0/" target="_blank" rel="noopener noreferrer">店面器</a></li>
                <li><a href="https://github.com/Floreal0/" target="_blank" rel="noopener noreferrer">Pygame练习集合</a></li>
              </ul>
            </li>
          </ul>
        </li>

        <!-- Materials 二级嵌套+超链接 -->
        <li class="parent-item">
          Materials
          <ul>
            <li><a href="https://github.com/Floreal0/GetSongs" target="_blank" rel="noopener noreferrer">学习文档</a></li>
            <li><a href="https://github.com/Floreal0/GetSongs" target="_blank" rel="noopener noreferrer">参考资料</a></li>
            <li><a href="https://github.com/Floreal0/GetSongs" target="_blank" rel="noopener noreferrer">课件素材</a></li>
          </ul>
        </li>
      </ul>
    </div>

    <div class="section">
      <h2>Discourse</h2>

      <!-- ===================== giscus 留言区 =====================
           启用步骤（一次性，约 2 分钟）：
           1. 仓库 Settings → General → Features → 勾选 "Discussions"
           2. 安装 giscus App：https://github.com/apps/giscus
           3. 打开 https://giscus.app/zh-CN ，输入仓库名 Floreal0/Floreal0.github.io，
              选择一个 Discussion 分类（推荐 Announcements，只有你能发起讨论，防骚扰），
              页面会生成一段 <script>，把其中的 data-repo-id 和 data-category-id
              复制到下方对应位置即可。
           repo-id 已经帮你预填好了（R_kgDOJAnkCw），只差 category-id。
      ========================================================= -->
      <div class="giscus-wrap" id="giscusWrap"></div>
    </div>
  </div>

  <div class="footer">© <span id="year"></span> Personal Website</div>
</div>

<script>
const toggle = document.getElementById('themeToggle');
const switchText = document.getElementById('switchText');
const switchTime = document.getElementById('switchTime');
const html = document.documentElement;

function getCurrentTime() {
  const now = new Date();
  const hours = now.getHours();
  const minutes = now.getMinutes();
  return `${hours.toString().padStart(2,'0')}:${minutes.toString().padStart(2,'0')}`;
}

function updateTimeDisplay() {
  switchTime.textContent = getCurrentTime();
}

setInterval(updateTimeDisplay, 1000);

// <head> 的内联脚本已经在渲染前设置好 data-theme（含系统偏好回退），
// 这里只负责把开关上的文字同步成正确状态
function loadTheme() {
  const isDark = html.getAttribute('data-theme') === 'dark';
  switchText.textContent = isDark ? 'Night' : 'Day';
}

toggle.addEventListener('click', () => {
  const toDark = html.getAttribute('data-theme') !== 'dark';
  if (toDark) {
    html.setAttribute('data-theme','dark');
    try { localStorage.setItem('site-theme','dark'); } catch (e) {}
  } else {
    html.removeAttribute('data-theme');
    try { localStorage.setItem('site-theme','light'); } catch (e) {}
  }
  switchText.textContent = toDark ? 'Night' : 'Day';
  postGiscusTheme(toDark);
});

// ===== 手风琴展开/收起（二级 + 三级）=====
// 展开时按内容的实际高度（scrollHeight）设置 max-height，
// 取代原来写死的 300px / 200px，条目再多也不会被截断
function toggleSub(ul) {
  if (!ul) return;
  const willShow = !ul.classList.contains('show');
  if (willShow) {
    ul.classList.add('show');
    ul.style.maxHeight = ul.scrollHeight + 'px';
  } else {
    // 先锁定当前高度再过渡到 0，避免收起瞬间跳变
    ul.style.maxHeight = ul.scrollHeight + 'px';
    void ul.offsetHeight; // 强制回流，确保过渡生效
    ul.classList.remove('show');
    ul.style.maxHeight = '0px';
  }
}

document.querySelectorAll('.parent-item').forEach(item => {
  item.addEventListener('click', function(e){
    if(e.target === this) toggleSub(this.querySelector('ul'));
  });
});

document.querySelectorAll('.sub-parent-item').forEach(item => {
  item.addEventListener('click', function(e){
    if(e.target === this) toggleSub(this.querySelector('ul'));
  });
});

// giscus 自定义主题：两套 CSS 需与 index.html 一起上传到仓库根目录
const GISCUS_THEMES = {
  light: 'https://floreal0.github.io/giscus-light.css',
  dark:  'https://floreal0.github.io/giscus-dark.css'
};

// ===== giscus 初始化 =====
(function initGiscus() {
  const wrap = document.getElementById('giscusWrap');
  if (!wrap) return;

  const REPO       = 'Floreal0/Floreal0.github.io';
  const REPO_ID    = 'R_kgDOJAnkCw';           // 来自 GitHub API
  const CATEGORY   = 'Announcements';
  const CATEGORY_ID = 'DIC_kwDOJAnkC84DEA_S';  // 来自 giscus.app

  const configured = CATEGORY_ID && !CATEGORY_ID.includes('_PLEASE_');
  if (!configured) {
    // 未配置时给出友好提示，而不是加载一个必然报错的空组件
    wrap.innerHTML =
      '<div class="giscus-hint">留言区待启用：在仓库设置中开启 Discussions 并安装 ' +
      '<a href="https://github.com/apps/giscus" target="_blank" rel="noopener noreferrer" style="color:inherit">giscus App</a>' +
      '，然后把 giscus.app 生成的 category-id 填入 index.html 中搜索 “PLEASE_FILL” 处。</div>';
    return;
  }

  const theme = html.getAttribute('data-theme') === 'dark' ? GISCUS_THEMES.dark : GISCUS_THEMES.light;

  const s = document.createElement('script');
  s.src = 'https://giscus.app/client.js';
  s.async = true;
  s.crossOrigin = 'anonymous';
  const attrs = {
    'data-repo': REPO,
    'data-repo-id': REPO_ID,
    'data-category': CATEGORY,
    'data-category-id': CATEGORY_ID,
    'data-mapping': 'pathname',
    'data-strict': '0',
    'data-reactions-enabled': '1',
    'data-emit-metadata': '0',
    'data-input-position': 'top', // 评论框在上、留言在下（还原原版布局）
    'data-theme': theme,   // 初始主题跟随当前站点主题
    'data-lang': 'zh-CN',
    'data-loading': 'lazy'
  };
  Object.keys(attrs).forEach(k => s.setAttribute(k, attrs[k]));
  wrap.appendChild(s);
})();

// 主题切换时同步 giscus 配色
function postGiscusTheme(isDark) {
  const iframe = document.querySelector('iframe.giscus-frame');
  if (!iframe) return;
  iframe.contentWindow.postMessage(
    { giscus: { setConfig: { theme: isDark ? GISCUS_THEMES.dark : GISCUS_THEMES.light } } },
    'https://giscus.app'
  );
}

// 页脚年份自动更新
document.getElementById('year').textContent = new Date().getFullYear();

loadTheme();
</script>
</body>
</html>
